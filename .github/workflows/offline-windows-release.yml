name: Build complete Windows offline deployment bundle
# The build runner is online. The published artifact runs offline on the GPU host.
# This is a BUILD WORKFLOW, not a Windows GPU media acceptance test.
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/m1-*']
    tags: ['v*']
    paths:
      - '.github/workflows/offline-windows-release.yml'
      - 'scripts/release/**'
      - 'deploy/windows/**'
      - 'app/api/v1/local/**'
      - 'lib/lab/local-*.mjs'
      - 'components/GameDetail.jsx'
      - 'components/PlayerView.jsx'
      - 'components/useLocalMoonlightEvidence.js'
      - 'components/LocalMediaEvidencePanel.jsx'
      - 'lib/lab/local-media-session.mjs'
      - 'scripts/p0/**'
      - 'lib/lab/moonlight-toolchain.mjs'
      - 'lib/lab/m1-acceptance.mjs'
      - 'lab/player.html'
      - 'integrations/moonlight-web/cloudplay-p0-telemetry.ts'
      - 'docs/M1-WINDOWS-GPU-ACCEPTANCE.md'

  # Rebuild a real native Windows artifact for trusted same-repository PRs before merge.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/offline-windows-release.yml'
      - 'integrations/moonlight-web/cloudplay-p0-telemetry.ts'
      - 'components/PlayerView.jsx'
      - 'components/useLocalMoonlightEvidence.js'
      - 'components/LocalMediaEvidencePanel.jsx'
      - 'lib/lab/local-media-session.mjs'
      - 'scripts/p0/**'
      - 'scripts/release/**'
      - 'deploy/windows/**'

concurrency:
  group: cloudplay-windows-offline-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-offline-bundle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout CloudPlay
        uses: actions/checkout@v4
        with:
          path: cloudplay
          persist-credentials: false
      - name: Checkout audited Moonlight source (no floating branch)
        uses: actions/checkout@v4
        with:
          repository: MrCreativ3001/moonlight-web-stream
          ref: 7b9821430e07087f459db3db9aac550e1e9c9bff
          path: moonlight-web
          persist-credentials: false
      - name: Setup Node 24 for CloudPlay
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Save CloudPlay Node directory for bundling
        id: cloud-node
        shell: pwsh
        run: |
          $nodeHome=Split-Path (Get-Command node).Source -Parent
          "home=$nodeHome" >> $env:GITHUB_OUTPUT
      - name: Build and test CloudPlay website
        shell: pwsh
        working-directory: cloudplay
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          node scripts/release/generate-notices.mjs | Out-File -FilePath web-DEPENDENCIES.txt -Encoding utf8
      - name: Setup Node 26 for Moonlight upstream
        uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - name: Use compatible npm 11.17
        shell: pwsh
        run: npm install --global npm@11.17.0 --no-audit --no-fund
      - name: Prepare Windows GNU toolchain for native Moonlight build
        shell: pwsh
        run: |
          # The audited upstream has rust-toolchain.toml: channel = "1.99.0".
          # The runner default may be newer; native GNU libcore MUST match 1.99.0.
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust 1.99.0 installation failed' }
          rustup target add --toolchain 1.99.0 x86_64-pc-windows-gnu wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust 1.99.0 target install failed' }
          $libdir=(& rustc +1.99.0 --print target-libdir --target x86_64-pc-windows-gnu).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $libdir) -or !(Get-ChildItem $libdir -Filter 'libcore-*.rlib' -ErrorAction SilentlyContinue)) {
            throw "Missing Rust 1.99.0 GNU target libcore in $libdir"
          }
          if (!(Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'MinGW install failed' }
          }
          if (!(Get-Command gcc -ErrorAction SilentlyContinue)) { throw 'MinGW gcc is not on PATH after setup' }
          if (!(Get-Command wasm-bindgen -ErrorAction SilentlyContinue)) {
            cargo install wasm-bindgen-cli --version 0.2.128 --locked
          }
      - name: Report compiler versions
        shell: pwsh
        run: |
          gcc -dumpmachine
          rustc --version
          cargo --version
          node --version
          npm --version
      - name: Compile patched Moonlight Web Stream
        shell: pwsh
        working-directory: cloudplay
        run: |
          .\scripts\p0\build-moonlight-web.ps1 -MoonlightPath ..\moonlight-web -Build
      - name: Restore CloudPlay Node 24 and assemble self-contained bundle
        shell: pwsh
        working-directory: cloudplay
        env:
          CLOUD_NODE_HOME: ${{ steps.cloud-node.outputs.home }}
        run: |
          $env:PATH=$env:CLOUD_NODE_HOME+';'+$env:PATH
          $node=Join-Path $env:CLOUD_NODE_HOME 'node.exe'
          $license=Join-Path $env:CLOUD_NODE_HOME 'LICENSE'
          if (!(Test-Path $license)) { throw 'Node distribution license not present; cannot ship a compliant offline bundle' }
          & $node scripts/release/pack-offline.mjs `
            --mode windows-full --out ..\dist\CloudPlay-Windows-Offline `
            --node $node --node-license $license `
            --next-standalone .next\standalone --next-static .next\static `
            --public public --web-notices web-DEPENDENCIES.txt `
            --moonlight-server ..\moonlight-web\target\x86_64-pc-windows-gnu\release\web-server.exe `
            --moonlight-static ..\moonlight-web\static `
            --moonlight-source ..\moonlight-web
          if($LASTEXITCODE -ne 0){throw 'Offline package creation failed'}
          & $node scripts/release/verify-offline.mjs ..\dist\CloudPlay-Windows-Offline
          if($LASTEXITCODE -ne 0){throw 'Offline package integrity validation failed'}
      - name: Publish offline deployment artifact (no runtime downloads required)
        uses: actions/upload-artifact@v4
        with:
          name: CloudPlay-Windows-Offline-v0.12.0
          path: dist/CloudPlay-Windows-Offline/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  offline-bundle-smoke:
    name: Clean Windows offline startup verification
    needs: windows-offline-bundle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download actual build artifact
        uses: actions/download-artifact@v4
        with:
          name: CloudPlay-Windows-Offline-v0.12.0
          path: release
      - name: Verify bundled Node, native Moonlight and Next startup with clean PATH
        shell: pwsh
        run: |
          & .\release\deploy\smoke-windows-offline.ps1 -BundlePath .\release
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Offline smoke failed' }

  offline-install-acceptance:
    name: Clean-host install, upgrade and rollback
    needs: offline-bundle-smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download release from this workflow
        uses: actions/download-artifact@v4
        with:
          name: CloudPlay-Windows-Offline-v0.12.0
          path: release
      - name: Exercise installed release slots with bundled Node only
        shell: pwsh
        run: |
          & .\scripts\release\smoke-windows-install.ps1 -BundlePath .\release
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Windows installation acceptance failed' }

  offline-services-acceptance:
    name: Real Moonlight HTTP and P0 coordinator/agent start
    needs: offline-install-acceptance
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download this build's verified offline bundle
        uses: actions/download-artifact@v4
        with:
          name: CloudPlay-Windows-Offline-v0.12.0
          path: release
      - name: Boot real local services under clean PATH
        shell: pwsh
        run: |
          & .\release\deploy\smoke-windows-services.ps1 -BundlePath .\release
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Live P0 service smoke failed' }

  offline-installed-runtime-acceptance:
    name: Install and run actual user-facing start-active/stop-active twice
    needs: offline-services-acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download this build's verified artifact
        uses: actions/download-artifact@v4
        with:
          name: CloudPlay-Windows-Offline-v0.12.0
          path: release
      - name: Verify installed release start, stop, cleanup, restart and persistence
        shell: pwsh
        run: |
          & .\release\deploy\smoke-windows-installed-runtime.ps1 -BundlePath .\release
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Installed runtime acceptance failed' }

  offline-local-operator-acceptance:
    name: Real installed local Quick Play policy and no-GPU refusal
    needs: offline-installed-runtime-acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download this workflow's verified Windows full bundle
        uses: actions/download-artifact@v4
        with:
          name: CloudPlay-Windows-Offline-v0.12.0
          path: release
      - name: Exercise installed local operator safeguards
        shell: pwsh
        run: |
          & .\release\deploy\smoke-windows-local-operator.ps1 -BundlePath .\release
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Local Quick Play negative acceptance failed' }
