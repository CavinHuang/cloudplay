# Default is a READY IMAGE deployment; never fetch npm or GitHub during runtime.
# On an offline host first load the image with deploy/docker/load-and-run.sh.
services:
  web:
    image: cloudplay-web:0.11.0
    pull_policy: never
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      CLOUDPLAY_P0_UI_ENABLED: '0'
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD','node','-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
