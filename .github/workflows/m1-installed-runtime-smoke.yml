name: CloudPlay M1 installed runtime smoke (development gate)
# Temporary quick CI against a previously built artifact; final pipeline must use
# the artifact from its own run. No GPU game evidence is claimed.
on:
  push:
    branches: [feat/m1-installed-start-stop-runtime]
    paths:
      - 'scripts/release/smoke-windows-installed-runtime.ps1'
      - '.github/workflows/m1-installed-runtime-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download previous verified complete Windows release
        uses: actions/download-artifact@v4
        with:
          repository: CavinHuang/cloudplay
          run-id: 41955026081
          name: CloudPlay-Windows-Offline-v0.12.0
          github-token: ${{ github.token }}
          path: release
      - name: Install and start/stop full release twice
        shell: pwsh
        run: |
          & .\scripts\release\smoke-windows-installed-runtime.ps1 -BundlePath .\release
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Installed runtime smoke failed' }
