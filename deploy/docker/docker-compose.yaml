# Offline: docker load -i images/cloudplay-web.tar; docker compose -f deploy/docker-compose.yaml up -d
# This deploys only the safe web catalog. A Windows GPU/Agent cannot run here.
services:
  web:
    image: cloudplay-web:0.12.0
    pull_policy: never
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      CLOUDPLAY_P0_UI_ENABLED: '0'
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /app/.next/cache:rw,nosuid,nodev,size=128m
    healthcheck:
      test: ['CMD','node','-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
