name: Validate CloudPlay installed Windows offline release
# Smoke-test the already SUCCESSFUL, provenance-pinned 2026-11-04 artifact.
# This lightweight job does not recompile Rust or require a GPU.
on:
  push:
    branches: [feat/p0-windows-release-ci-v0.13]
    paths:
      - 'scripts/release/smoke-windows-install.ps1'
      - '.github/workflows/windows-install-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install-upgrade-rollback:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified release built by CI run 41813650824
        uses: actions/download-artifact@v4
        with:
          name: CloudPlay-Windows-Offline-v0.12.0
          repository: CavinHuang/cloudplay
          run-id: 41813650824
          github-token: ${{ github.token }}
          path: release
      - name: Install, upgrade, rollback, reject tampering under clean PATH
        shell: pwsh
        run: |
          & .\scripts\release\smoke-windows-install.ps1 -BundlePath .\release
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Windows installer acceptance failed' }
